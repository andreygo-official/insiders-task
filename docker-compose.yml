
services:
  postgres:
    image: postgres:16-alpine
    container_name: insiders-task-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
      POSTGRES_DB: taskflow_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
